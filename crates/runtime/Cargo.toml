[package]
name = "vrcx-0-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
chrono = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", features = [
    "cookies",
    "gzip",
    "brotli",
    "deflate",
    "multipart",
    "socks"
] }
reqwest_cookie_store = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
url = "2"
walkdir = "2"
vrcx-0-core = { path = "../core" }
vrcx-0-host = { path = "../host" }
vrcx-0-media = { path = "../media" }
vrcx-0-store = { path = "../store" }

[dev-dependencies]
image = "0.25"
rusqlite = { version = "0.39", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
