[package]
name = "vrcx-0-runtime"
version = "0.1.0"
edition = "2021"

[features]
test-utils = []

[dependencies]
chrono = "0.4"
futures-util = "0.3"
percent-encoding = "2"
reqwest_cookie_store = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
url = "2"
walkdir = "2"
vrcx-0-core = { path = "../core" }
vrcx-0-host = { path = "../host" }
vrcx-0-media = { path = "../media" }
vrcx-0-store = { path = "../store" }
vrcx-0-vrchat = { path = "../vrchat" }

[dev-dependencies]
image = "0.25"
rusqlite = { version = "0.39", features = ["bundled"] }
