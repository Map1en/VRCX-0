[package]
name = "vrcx-0-application"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Application business services"

[features]
test-utils = [
    "vrcx-0-application-core/test-utils",
    "vrcx-0-application-realtime/test-utils"
]

[dependencies]
chrono = { workspace = true }
base64 = { workspace = true }
fastrand = "2"
futures-util = "0.3"
hex = "0.4"
moka = { version = "0.12", features = ["future"] }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "sync",
    "time"
] }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
vrcx-0-core = { path = "../core" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-realtime = { path = "../application-realtime" }
specta.workspace = true

[dev-dependencies]
async-trait = { workspace = true }
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }
vrcx-0-application-realtime = { path = "../application-realtime", features = ["test-utils"] }
