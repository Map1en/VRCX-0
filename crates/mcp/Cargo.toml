[package]
name = "vrcx-0-mcp"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Local MCP server"

[dependencies]
axum = "0.8"
chrono = { workspace = true }
compact_str = { workspace = true }
getrandom = "0.4"
http-body = "1"
rmcp = { version = "=3.2.0", features = [
    "client",
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server"
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "sync",
    "time"
] }
tokio-util = { workspace = true }
tracing = { workspace = true }
vrcx-0-application = { path = "../application" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-core = { path = "../core" }
vrcx-0-local-server = { path = "../local-server" }

[dev-dependencies]
vrcx-0-outbound-adapters = { path = "../outbound-adapters" }
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }
vrcx-0-persistence = { path = "../persistence" }
