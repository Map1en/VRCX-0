[package]
name = "vrcx-0-overlay-runtime"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "VR overlay runtime"

[features]
default = []
steamvr-overlay = ["vrcx-0-vr-overlay-backend/steamvr-overlay"]
openxr-overlay = ["vrcx-0-vr-overlay-backend/openxr-overlay"]

[dependencies]
chrono = { workspace = true }
image.workspace = true
moka = { version = "0.12", features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "sync"] }
tracing = { workspace = true }
vrcx-0-application-activity = { path = "../application-activity" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-game = { path = "../application-game" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-core = { path = "../core" }
vrcx-0-host-desktop = { path = "../host-desktop" }
vrcx-0-i18n = { path = "../i18n" }
vrcx-0-vr-overlay = { path = "../vr-overlay", features = ["slint-ui"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
vrcx-0-vr-overlay-backend = { path = "../vr-overlay-backend" }

[dev-dependencies]
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging"
] }
