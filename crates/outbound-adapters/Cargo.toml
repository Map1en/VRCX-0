[package]
name = "vrcx-0-outbound-adapters"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Concrete outbound adapters for application-owned ports"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
iana-time-zone.workspace = true
futures-util = "0.3"
moka = { version = "0.12", features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sys-locale.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
zip = { workspace = true }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application = { path = "../application" }
vrcx-0-application-activity = { path = "../application-activity" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-core = { path = "../core" }
vrcx-0-integrations = { path = "../integrations" }
vrcx-0-media = { path = "../media" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-vrchat-client = { path = "../vrchat-client" }

[dev-dependencies]
base64 = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }
