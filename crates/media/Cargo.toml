[package]
name = "vrcx-0-media"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Media processing utilities"

[dependencies]
base64 = { workspace = true }
fast_rsync = "0.2"
fast_image_resize = { version = "6.0.0", features = [
    "image",
    "rayon"
] }
hex = "0.4"
image = { workspace = true }
jpeg-encoder = { version = "0.7", features = ["simd"] }
sha2 = "0.11"
serde_json = { workspace = true }
thiserror = { workspace = true }
vrcx-0-core = { path = "../core" }
vrcx-0-contracts = { path = "../contracts" }
walkdir = { workspace = true }
webp = "0.3.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt"] }
