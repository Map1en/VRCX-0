[package]
name = "vrcx-0-vr-overlay"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "VR overlay UI"
build = "build.rs"

[features]
default = []
slint-ui = ["dep:slint", "dep:slint-build"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
slint = { workspace = true, optional = true }
specta.workspace = true

[build-dependencies]
slint-build = { workspace = true, optional = true }
