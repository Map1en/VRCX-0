[package]
name = "vrcx-0-runtime-host-desktop"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Desktop runtime composition"

[features]
default = []
steamvr-overlay = ["vrcx-0-overlay-runtime/steamvr-overlay"]
openxr-overlay = ["vrcx-0-overlay-runtime/openxr-overlay"]
test-utils = [
    "vrcx-0-application/test-utils",
    "vrcx-0-application-core/test-utils",
    "vrcx-0-application-game/test-utils",
    "vrcx-0-application-realtime/test-utils",
    "vrcx-0-composition/test-utils"
]

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta.workspace = true
chrono = { workspace = true }
fs4 = { workspace = true }
sys-locale.workspace = true
tokio = { workspace = true, features = ["time", "rt", "macros", "sync"] }
tracing = { workspace = true }
vrcx-0-application = { path = "../application" }
vrcx-0-application-activity = { path = "../application-activity" }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-application-game = { path = "../application-game" }
vrcx-0-application-realtime = { path = "../application-realtime" }
vrcx-0-core = { path = "../core" }
vrcx-0-platform = { path = "../platform" }
vrcx-0-host-desktop = { path = "../host-desktop" }
vrcx-0-i18n = { path = "../i18n" }
vrcx-0-integration-api = { path = "../integration-api" }
vrcx-0-integrations = { path = "../integrations" }
vrcx-0-media = { path = "../media" }
vrcx-0-persistence = { path = "../persistence" }
vrcx-0-composition = { path = "../composition" }
vrcx-0-vrchat-client = { path = "../vrchat-client" }
vrcx-0-outbound-adapters = { path = "../outbound-adapters" }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
vrcx-0-overlay-runtime = { path = "../overlay-runtime" }
