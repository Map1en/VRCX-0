[package]
name = "vrcx-0-integrations"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "External service clients"

[dependencies]
futures-util = "0.3"
reqwest = { workspace = true, features = ["json", "socks", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }
vrcx-0-core = { path = "../core" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-logger-protocol = { path = "../logger-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
