[package]
name = "vrcx-0-application-core"
version = "0.1.0"
edition = "2021"

[features]
test-utils = []

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
moka = { version = "0.12", features = ["sync"] }
serde = { workspace = true, features = ["derive"] }
