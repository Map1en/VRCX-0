[package]
name = "vrcx-0-vrchat"
version = "0.1.0"
edition = "2021"

[dependencies]
percent-encoding = "2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
url = "2"
vrcx-0-core = { path = "../core" }
