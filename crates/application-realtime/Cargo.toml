[package]
name = "vrcx-0-application-realtime"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Realtime state runtime"

[features]
test-utils = [
    "vrcx-0-application-core/test-utils",
]

[dependencies]
chrono = { workspace = true }
compact_str = { workspace = true }
futures-util = "0.3"
moka = { version = "0.12", features = ["future"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
specta = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
    "io-util"
] }
tracing = { workspace = true }
vrcx-0-application-core = { path = "../application-core" }
vrcx-0-contracts = { path = "../contracts" }
vrcx-0-core = { path = "../core" }
vrcx-0-i18n = { path = "../i18n" }
vrcx-0-logger-protocol = { path = "../logger-protocol" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
vrcx-0-application-core = { path = "../application-core", features = ["test-utils"] }
