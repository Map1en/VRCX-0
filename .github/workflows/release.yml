name: Build & Release

on:
    workflow_dispatch:
        inputs:
            release:
                description: 'Create a GitHub Pre-Release'
                type: boolean
                default: false
            stable:
                description: 'Stable release'
                type: boolean
                default: false

concurrency:
    group: ${{ github.ref }}-build
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v6

            - id: meta
              run: |
                  if [ "${{ inputs.release }}" = "true" ] && [ "${{ inputs.stable }}" = "true" ]; then
                      version="$(cat Version)"
                      prerelease=false
                  elif [ "${{ inputs.release }}" = "true" ]; then
                      version=$(sed -n 's/^## *//p' CHANGELOG-beta.md | head -1)
                      prerelease=true
                  else
                      version="$(cat Version)"
                      prerelease=false
                  fi
                  echo "version=${version}"       >> "$GITHUB_OUTPUT"
                  echo "tag=v${version}"           >> "$GITHUB_OUTPUT"
                  echo "name=VRCX-0 ${version}"   >> "$GITHUB_OUTPUT"
                  echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

            - id: changelog
              if: inputs.release
              run: |
                  if [ "${{ inputs.stable }}" = "true" ]; then
                      src="CHANGELOG.md"
                  else
                      src="CHANGELOG-beta.md"
                  fi
                  notes=$(sed '1{/^## /d}' "$src" | sed '/^<!--/,/-->/d' | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
                  if [ -z "$notes" ]; then
                      notes="No changelog provided."
                  fi
                  echo "$notes" > .release-notes.md

            - uses: dtolnay/rust-toolchain@stable

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm

            - uses: actions/cache@v5
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      src-tauri/target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
                  restore-keys: ${{ runner.os }}-cargo-

            - run: npm ci
            - run: npx tauri build

            # ── Artifacts (always) ───────────────────────────
            - name: Upload bundle
              uses: actions/upload-artifact@v7
              with:
                  name: VRCX-0-bundle
                  path: src-tauri/target/release/bundle/nsis/*

            # ── Release (conditional) ────────────────────────
            - name: SHA256
              if: inputs.release
              run: |
                  cd src-tauri/target/release/bundle/nsis
                  sha256sum *.exe > SHA256SUMS.txt

            - name: Create GitHub Release
              if: inputs.release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.name }}
                  prerelease: ${{ steps.meta.outputs.prerelease }}
                  body_path: .release-notes.md
                  files: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
