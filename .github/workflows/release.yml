name: Build & Release

on:
    workflow_dispatch:
        inputs:
            channel:
                description: 'Release channel'
                required: true
                type: choice
                options:
                    - stable
                    - beta
                default: stable
            publish:
                description: 'Publish a GitHub release'
                type: boolean
                default: false
            beta_number:
                description: 'Beta suffix number'
                required: false
                type: string
                default: '1'

concurrency:
    group: ${{ github.ref }}-build
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v6

            - id: meta
              run: |
                  base_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
                  channel="${{ inputs.channel }}"
                  beta_number="${{ inputs.beta_number }}"

                  if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                      echo "Invalid base version: $base_version" >&2
                      exit 1
                  fi

                  IFS='.' read -r year month day <<< "$base_version"
                  display_version=$(printf '%04d.%02d.%02d' "$year" "$month" "$day")

                  if [ "$channel" = "beta" ]; then
                      if [[ ! "$beta_number" =~ ^[1-9][0-9]*$ ]]; then
                          echo "Invalid beta_number: $beta_number" >&2
                          exit 1
                      fi
                      build_version="${base_version}-beta.${beta_number}"
                      display_version="${display_version}-beta.${beta_number}"
                      prerelease=true
                  else
                      build_version="${base_version}"
                      prerelease=false
                  fi

                  echo "base_version=${base_version}"       >> "$GITHUB_OUTPUT"
                  echo "build_version=${build_version}"     >> "$GITHUB_OUTPUT"
                  echo "display_version=${display_version}" >> "$GITHUB_OUTPUT"
                  echo "tag=v${build_version}"              >> "$GITHUB_OUTPUT"
                  echo "name=VRCX-0 ${display_version}"     >> "$GITHUB_OUTPUT"
                  echo "prerelease=${prerelease}"           >> "$GITHUB_OUTPUT"

            - id: changelog
              if: inputs.publish
              run: |
                  if [ "${{ inputs.channel }}" = "stable" ]; then
                      src="CHANGELOG.md"
                  else
                      src="CHANGELOG-beta.md"
                  fi
                  notes=$(sed '1{/^## /d}' "$src" | sed '/^<!--/,/-->/d' | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
                  if [ -z "$notes" ]; then
                      notes="No changelog provided."
                  fi
                  echo "$notes" > .release-notes.md

            - name: Sync build version into manifests
              run: |
                  build_version="${{ steps.meta.outputs.build_version }}"
                  node <<'NODE'
                  const fs = require('node:fs');
                  const buildVersion = process.env.BUILD_VERSION;

                  const tauriPath = './src-tauri/tauri.conf.json';
                  const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
                  tauri.version = buildVersion;
                  fs.writeFileSync(tauriPath, `${JSON.stringify(tauri, null, 2)}\n`);

                  const cargoPath = './src-tauri/Cargo.toml';
                  const cargo = fs.readFileSync(cargoPath, 'utf8');
                  const nextCargo = cargo.replace(
                    /^version = ".*"$/m,
                    `version = "${buildVersion}"`
                  );
                  if (cargo === nextCargo) {
                    throw new Error('Failed to update Cargo.toml version');
                  }
                  fs.writeFileSync(cargoPath, nextCargo);
                  NODE
              env:
                  BUILD_VERSION: ${{ steps.meta.outputs.build_version }}

            - uses: dtolnay/rust-toolchain@stable

            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - run: npm ci
            - run: npm run tauri:build

            - name: Upload NSIS installer
              uses: actions/upload-artifact@v7
              with:
                  name: VRCX-0-installer
                  path: src-tauri/target/release/bundle/nsis/*.exe

            - name: Create GitHub Release
              if: inputs.publish
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.name }}
                  prerelease: ${{ steps.meta.outputs.prerelease }}
                  body_path: .release-notes.md
                  files: |
                      src-tauri/target/release/bundle/nsis/*.exe
