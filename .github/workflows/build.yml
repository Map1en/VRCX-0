name: Build

on:
    push:
        branches:
            - master
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    changes:
        name: Detect Changes
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
            rust: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.rust }}
        steps:
            - uses: actions/checkout@v5
            - uses: dorny/paths-filter@v3
              if: github.event_name != 'workflow_dispatch'
              id: filter
              with:
                  filters: |
                      frontend:
                        - '.github/workflows/build.yml'
                        - 'index.html'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'public/**'
                        - 'scripts/**'
                        - 'src/**'
                        - 'tsconfig*.json'
                        - 'vite.config.*'
                      rust:
                        - '.github/workflows/build.yml'
                        - 'Cargo.lock'
                        - 'Cargo.toml'
                        - 'crates/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'scripts/**'
                        - 'src-tauri/**'

    frontend-checks:
        name: Frontend Checks
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.frontend == 'true'
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run format:check
            - run: npm run lint
            - run: npm run typecheck

    frontend:
        name: Frontend React
        runs-on: ubuntu-latest
        needs: changes
        if: needs.changes.outputs.frontend == 'true'
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24.x
                  cache: npm
            - run: npm ci
            - run: npm run build
            - uses: actions/upload-artifact@v6
              with:
                  name: frontend-dist
                  path: dist
                  if-no-files-found: error

    rust-checks:
        name: Rust Checks
        runs-on: ubuntu-24.04
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        steps:
            - uses: actions/checkout@v5
            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      clang \
                      cmake \
                      g++ \
                      libclang-dev \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev
            - uses: actions/setup-node@v5
              with:
                  node-version: 24.x
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
            - run: npm run rust:fmt:check
            - run: mkdir -p dist && printf '<!doctype html><html><body></body></html>' > dist/index.html
            - run: npm run rust:clippy

    tauri:
        name: Tauri Rust (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        defaults:
            run:
                shell: bash
        strategy:
            fail-fast: false
            matrix:
                include:
                    - label: Windows
                      os: windows-latest
                      rust_target: ''
                    - label: Linux
                      os: ubuntu-24.04
                      rust_target: ''
                    - label: macOS Apple Silicon
                      os: macos-latest
                      rust_target: aarch64-apple-darwin
                    - label: macOS Intel
                      os: macos-latest
                      rust_target: x86_64-apple-darwin
        steps:
            - uses: actions/checkout@v5
            - name: Install Linux dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                      clang \
                      cmake \
                      g++ \
                      libclang-dev \
                      libwebkit2gtk-4.1-dev \
                      libgtk-3-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev
            - uses: dtolnay/rust-toolchain@stable
            - name: Install Rust target
              if: matrix.rust_target != ''
              run: rustup target add "${{ matrix.rust_target }}"
            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: . -> target
            - run: mkdir -p dist && printf '<!doctype html><html><body></body></html>' > dist/index.html
            - name: Build Tauri crate
              env:
                  RUST_TARGET: ${{ matrix.rust_target }}
              run: |
                  if [[ -n "$RUST_TARGET" ]]; then
                      cargo build --manifest-path src-tauri/Cargo.toml --locked --target "$RUST_TARGET"
                  else
                      cargo build --manifest-path src-tauri/Cargo.toml --locked
                  fi
