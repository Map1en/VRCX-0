# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
    - package-ecosystem: 'npm' # See documentation for possible values
      directory: '/' # Location of package manifests
      schedule:
          interval: 'weekly'
    - package-ecosystem: 'cargo'
      directory: '/'
      schedule:
          interval: 'weekly'
      ignore:
          # tauri-specta pins an exact specta prerelease; bump the three by hand
          # together and regenerate bindings.ts in the same change.
          - dependency-name: 'specta'
          - dependency-name: 'tauri-specta'
          - dependency-name: 'specta-typescript'
          # src-tauri pins rust-ini =0.21.1 only to hold tauri-plugin-deep-link's
          # Linux build; drop both pins once deep-link builds with a newer rust-ini.
          - dependency-name: 'rust-ini'
