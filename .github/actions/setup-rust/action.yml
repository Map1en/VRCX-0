name: Setup Rust
description: Set up Rust and restore the shared CI dependency cache.

inputs:
    components:
        description: Comma-separated Rust components to install.
        required: false
        default: ''
    target:
        description: Additional Rust compilation target to install.
        required: false
        default: ''
    cache-key:
        description: Stable cache role including the compilation target.
        required: true
    save-cache:
        description: Whether this job owns saving the cache.
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - uses: dtolnay/rust-toolchain@stable
          if: inputs.components == ''
        - uses: dtolnay/rust-toolchain@stable
          if: inputs.components != ''
          with:
              components: ${{ inputs.components }}
        - if: inputs.target != ''
          run: rustup target add "${{ inputs.target }}"
          shell: bash
        - uses: Swatinem/rust-cache@v2
          with:
              workspaces: . -> target
              shared-key: ${{ inputs.cache-key }}
              save-if: ${{ inputs.save-cache == 'true' }}
